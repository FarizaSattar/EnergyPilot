services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: energypilot
      POSTGRES_USER: energypilot
      POSTGRES_PASSWORD: energypilot
    ports:
      - "5432:5432"
    volumes:
      - ep_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

volumes:
  ep_pg:
