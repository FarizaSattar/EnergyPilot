<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary Metadata -->
    <title>EnergyPilot | Energy Intelligence Platform</title>
    <meta
      name="description"
      content="EnergyPilot is an intelligent energy analytics platform for building performance, load forecasting, electricity pricing, and energy-saving recommendations."
    />
    <meta name="application-name" content="EnergyPilot" />
    <meta name="author" content="EnergyPilot" />
    <meta name="keywords" content="energy management, grid intelligence, load forecasting, sustainability, building analytics" />

    <!-- Theme Color Syncing (Dark & Light Mode Support) -->
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#091310" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Font Preloading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Dynamic Vector Favicon & Apple Touch Icon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f766e'/%3E%3Ctext x='50' y='69' font-size='60' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f766e'/%3E%3Ctext x='50' y='69' font-size='60' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E"
    />

    <!-- Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EnergyPilot" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph / Social Embeds -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EnergyPilot | Energy Intelligence Platform" />
    <meta
      property="og:description"
      content="Intelligent building energy analytics, load forecasting, electricity pricing analysis, and energy-saving recommendations."
    />
    <meta property="og:site_name" content="EnergyPilot" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EnergyPilot | Energy Intelligence Platform" />
    <meta
      name="twitter:description"
      content="Intelligent building energy analytics, load forecasting, electricity pricing analysis, and energy-saving recommendations."
    />

    <!-- Entry Point Script -->
    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <!-- React Root Mount -->
    <div id="root"></div>

    <!-- Noscript Fallback -->
    <noscript>
      <div style="
        font-family: Inter, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #091310;
        color: #f0f4f2;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      ">
        <div style="
          width: 64px;
          height: 64px;
          background: #0f766e;
          border-radius: 16px;
          display: grid;
          place-items: center;
          font-size: 32px;
          margin-bottom: 1.5rem;
        ">⚡</div>
        <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0 0 0.5rem 0;">EnergyPilot</h1>
        <p style="color: #798c84; max-width: 420px; line-height: 1.5; font-size: 0.9rem; margin: 0 0 1.5rem 0;">
          EnergyPilot relies on JavaScript for real-time telemetry processing, analytics calculation, and interactive intelligence models.
        </p>
        <p style="font-size: 0.85rem; color: #a3b3ac;">
          Please enable JavaScript in your browser settings to continue.
        </p>
      </div>
    </noscript>
  </body>
</html>
